name: Publicar portal

on:
  push:
    branches: [main]
    paths: ["portal/**", "supabase/functions/rep/jornada.ts", ".github/workflows/portal.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm run build
      # O servidor busca esta branch a cada 5 minutos e publica o conteudo.
      - name: Publicar na branch portal-dist
        working-directory: portal/dist
        run: |
          git init -q
          git checkout -q -b portal-dist
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "Portal ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" portal-dist
